server:
  port: 8091

spring:
  application:
    name: oms-order-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/jim_oms_order?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    consumer:
      group-id: oms-order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

eureka:
  client:
    service-url:
      defaultZone: http://127.0.0.1:8762/eureka/
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true
    ip-address: 127.0.0.1
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# OMS 对接外部依赖的可调配置；连接与读超时显式给出，不依赖默认值。
oms:
  wms:
    # WMS integration 服务地址；OMS 只通过 HTTP 调它，不直连 WMS 数据库
    base-url: http://127.0.0.1:8089
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
  product:
    # OMS 自己的商品服务地址，下单前校验与计价
    base-url: http://127.0.0.1:8090
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  push:
    # 补偿任务扫描间隔（毫秒）与最大重试次数
    scan-interval-ms: 2000
    max-retry: 20

logging:
  level:
    com.jim.oms: debug
